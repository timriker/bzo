name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-check:
    name: Lint and check
    runs-on: ubuntu-26.04
    # Ubuntu's own Node and npm, as a server running bzo from source has them,
    # rather than the runner's.
    container: ubuntu:26.04

    steps:
      - name: Install Node.js, npm, git and markdownlint
        # The checkout belongs to the runner's user, not the container's root,
        # and git refuses a repository it does not own without this.
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs npm markdownlint
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Lint and validate
        run: npm run check

  npm-audit:
    name: Audit production dependencies
    runs-on: ubuntu-26.04
    # Ubuntu's own Node and npm, as a server running bzo from source has them,
    # rather than the runner's.
    container: ubuntu:26.04

    steps:
      - name: Install Node.js and npm
        # The checkout belongs to the runner's user, not the container's root,
        # and git refuses a repository it does not own without this.
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs npm
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Check production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high


  codeql:
    name: CodeQL
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  container-build:
    name: Build and smoke-test Ubuntu 26.04 ${{ matrix.platform }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: bzo:ci-ubuntu26.04-${{ strategy.job-index }}
          provenance: false
          sbom: false

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          image="bzo:ci-ubuntu26.04-${{ strategy.job-index }}"
          actual_node="$(docker run --rm --platform "${{ matrix.platform }}" "$image" node --version)"
          case "$actual_node" in v22.*) ;; *) echo "expected Ubuntu's Node 22, got $actual_node" >&2; exit 1 ;; esac
          docker run --rm --platform "${{ matrix.platform }}" "$image" node --check server.js
