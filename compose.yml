services:
  bzo:
    image: ghcr.io/timriker/bzo:latest
    restart: unless-stopped
    ports:
      # The web app, and BZFlag clients when server.json has a `bzflag`
      # block: TCP for the game and the web app, UDP for BZFlag's ping and
      # movement link.
      - "5154:5154/tcp"
      - "5154:5154/udp"
      # The UDP channel over WebRTC, when server.json has `webrtc.listen`.
      - "5153:5153/udp"
    environment:
      SERVER_CONFIG_PATH: /data/server.json
    volumes:
      - ./data:/data
