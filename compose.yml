services:
  bzo:
    image: ghcr.io/timriker/bzo:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
      # BZFlag clients, when server.json has a `bzflag` block: TCP for the
      # game, UDP for its ping and the movement link.
      - "5154:5154/tcp"
      - "5154:5154/udp"
      # Moves over WebRTC, when server.json has `webrtc.listen`.
      - "5153:5153/udp"
    environment:
      PORT: "3000"
      SERVER_CONFIG_PATH: /data/server.json
    volumes:
      - ./data:/data
